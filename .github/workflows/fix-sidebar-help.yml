name: Fix sidebar help layout

on:
  push:
    paths:
      - '.fix-sidebar-help'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply sidebar layout fix
        run: python tools/fix_sidebar_help_layout.py
      - name: Validate JavaScript and JSON
        shell: bash
        run: |
          set -euo pipefail
          for f in *.js; do node --check "$f"; done
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('.').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          PY
      - name: Remove one-shot files
        shell: bash
        run: |
          rm -f .fix-sidebar-help
          rm -f tools/fix_sidebar_help_layout.py
          rm -f .github/workflows/fix-sidebar-help.yml
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep sidebar help actions on one row"
          git push
