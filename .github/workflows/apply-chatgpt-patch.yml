name: Apply ChatGPT patch

on:
  push:
    paths:
      - '.patches/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply queued patches
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          patches=(.patches/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "No patch files found."
            exit 1
          fi
          for patch in "${patches[@]}"; do
            git apply --check "$patch"
            git apply "$patch"
          done
          rm -rf .patches
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply ChatGPT update"
          git push
