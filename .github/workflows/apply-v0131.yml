name: Apply LyricTube v0.13.1 player refactor

on:
  push:
    paths:
      - '.apply-v0131'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize safe refactor guards
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_v0131_player.py')
          text = path.read_text(encoding='utf-8')

          old_helper = '''    brace = text.find("{", start)\n    if brace < 0:\n        raise RuntimeError(f"opening brace not found: {name}")\n    depth = 0\n    quote = None\n    escape = False\n    i = brace'''
          new_helper = '''    paren = text.find("(", start)\n    if paren < 0:\n        raise RuntimeError(f"opening parenthesis not found: {name}")\n    pdepth = 0\n    quote = None\n    escape = False\n    i = paren\n    while i < len(text):\n        ch = text[i]\n        if quote:\n            if escape:\n                escape = False\n            elif ch == "\\\\":\n                escape = True\n            elif ch == quote:\n                quote = None\n        else:\n            if ch in ('\\"', "'", '`'):\n                quote = ch\n            elif ch == "(":\n                pdepth += 1\n            elif ch == ")":\n                pdepth -= 1\n                if pdepth == 0:\n                    break\n        i += 1\n    if pdepth != 0:\n        raise RuntimeError(f"closing parenthesis not found: {name}")\n    brace = text.find("{", i + 1)\n    if brace < 0:\n        raise RuntimeError(f"opening brace not found: {name}")\n    depth = 0\n    quote = None\n    escape = False\n    i = brace'''
          if old_helper not in text:
              raise SystemExit('replace_function helper shape not found')
          text = text.replace(old_helper, new_helper, 1)

          old = '''if old_playing_state not in app:\n    raise RuntimeError("playing state block not found")\napp = app.replace(old_playing_state, new_playing_state, 1)'''
          new = '''if old_playing_state in app:\n    app = app.replace(old_playing_state, new_playing_state, 1)\nelif "const playing=playerStateSafe()===1;" not in app and "document.body.classList.toggle('is-playing',playerStateSafe()===1);" not in app:\n    raise RuntimeError("playing state block not found")'''
          if old in text:
              text = text.replace(old, new, 1)
          text = text.replace('rule_end_marker = "  function togglePlayback() {"', 'rule_end_marker = "  function togglePlayback()"')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply player controller refactor
        run: python tools/apply_v0131_player.py

      - name: Check JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          for file in tests/*.test.js; do
            [ -e "$file" ] || continue
            echo "node $file"
            node "$file"
          done

      - name: Validate static files
        run: python tools/validate_static.py

      - name: Remove one-shot inputs
        run: rm -f .apply-v0131 tools/apply_v0131_player.py

      - name: Commit refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: unify YouTube and local media playback"
          git push
