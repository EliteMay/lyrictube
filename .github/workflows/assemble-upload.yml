name: Assemble LyricTube upload

on:
  push:
    paths:
      - '.upload/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble text files
        shell: bash
        run: |
          set -euo pipefail
          cat .upload/index_html.*.b64 | tr -d '\n' | base64 -d > index.html
          cat .upload/styles_css.*.b64 | tr -d '\n' | base64 -d > styles.css
          cat .upload/app_js.*.b64 | tr -d '\n' | base64 -d > app.js
          cat .upload/report_md.*.b64 | tr -d '\n' | base64 -d > 作業報告書.md
          rm -rf .upload
      - name: Commit assembled project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Deploy LyricTube GitHub Pages v28"
          git push
