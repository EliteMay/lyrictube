name: Apply Sidebar Fix

on:
  push:
    paths:
      - 'tools/apply_sidebar_fix.py'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply fix
        run: python tools/apply_sidebar_fix.py
      - name: Validate
        run: |
          node tests/sidebar-layout.test.js
          for file in tests/*.test.js; do node "$file"; done
          python tools/validate_static.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sidebar.css version.js data/defaults.json README.md 作業報告書.md docs/CHANGELOG.md tests/sidebar-layout.test.js
          git commit -m 'fix: stabilize sidebar layout'
          git push origin HEAD:main
