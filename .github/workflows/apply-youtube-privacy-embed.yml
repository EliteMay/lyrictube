name: Apply YouTube privacy embed migration

on:
  push:
    branches:
      - fix/youtube-privacy-embed-path
    paths:
      - tools/apply_youtube_privacy_embed.py
      - tools/fix_youtube_privacy_test.py
      - .github/workflows/apply-youtube-privacy-embed.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/youtube-privacy-embed-path
      - name: Apply patch
        run: |
          python tools/apply_youtube_privacy_embed.py
          python tools/fix_youtube_privacy_test.py
      - name: Validate
        run: |
          node --check app.js
          node --check a1-ui-guards.js
          node tests/a1-requirements.test.js
          node tests/runtime-guards.test.js
          python tools/validate_static.py
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js a1-ui-guards.js index.html tests/a1-requirements.test.js version.js README.md data/defaults.json PROJECT_LEARNINGS.md docs/CHANGELOG.md docs/WORK_REPORT_2026-09-06_YOUTUBE_EMBED_PATH.md
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "perf: test YouTube privacy-enhanced embed path"
          git push origin HEAD:fix/youtube-privacy-embed-path
