name: Temporary Account Register Scroll Fix

on:
  push:
    branches:
      - fix/account-register-scroll

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/account-register-scroll
      - name: Apply focused patch
        run: python tools/_tmp_fix_account_register_scroll.py
      - name: Validate focused files
        run: |
          set -euo pipefail
          node --check site-shell.js
          node tests/account-register-scroll.test.js
          node tests/account-registration.test.js
          python -m json.tool data/defaults.json >/dev/null
      - name: Commit final branch state and remove temporary assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_tmp-account-register-scroll.yml tools/_tmp_fix_account_register_scroll.py
          git add auth-ui.css version.js data/defaults.json index.html site-shell.js README.md docs/CHANGELOG.md PROJECT_LEARNINGS.md tests/account-register-scroll.test.js
          if [ -f "作業報告書.md" ]; then git add "作業報告書.md"; fi
          git diff --cached --check
          git commit -m "fix: make account registration scrollable"
          git push origin HEAD:fix/account-register-scroll
