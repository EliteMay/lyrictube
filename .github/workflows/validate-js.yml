name: Validate LyricTube

on:
  push:
    paths:
      - '**.js'
      - '**.json'
      - '**.html'
      - '**.css'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/validate-js.yml'
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check every JavaScript file
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "node --check $file"
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)

      - name: Check Python maintenance tools
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/*.py

      - name: Test account register scroll
        run: node tests/account-register-scroll.test.js
      - name: Test account registration
        run: node tests/account-registration.test.js
      - name: Test A1 completed requirements
        run: node tests/a1-requirements.test.js
      - name: Test app utilities
        run: node tests/app-utils.test.js
      - name: Test fair shuffle integration
        run: node tests/fair-shuffle-integration.test.js
      - name: Test fair shuffle
        run: node tests/fair-shuffle.test.js
      - name: Test library schema
        run: node tests/library-schema.test.js
      - name: Test A1 playback state
        run: node tests/playback-state.test.js
      - name: Test player controller
        run: node tests/player-controller.test.js
      - name: Run runtime regression guards
        run: node tests/runtime-guards.test.js
      - name: Test runtime hooks
        run: node tests/runtime-hooks.test.js
      - name: Test sidebar layout
        run: node tests/sidebar-layout.test.js
      - name: Test song form tags
        run: node tests/song-form-tags.test.js
      - name: Test sync interpolation
        run: node tests/sync-interpolation.test.js

      - name: Validate JSON and local asset links
        run: python tools/validate_static.py

      - name: Guard against legacy runtime layers
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'local-audio.js' index.html
          ! grep -q 'local-audio.css' index.html
          ! grep -q 'data:image/' index.html
