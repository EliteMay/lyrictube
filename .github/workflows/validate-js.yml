name: Validate LyricTube

on:
  push:
    paths:
      - '**.js'
      - '**.json'
      - '**.html'
      - '**.css'
      - 'tools/**'
      - '.github/workflows/validate-js.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check every JavaScript file
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "node --check $file"
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)

      - name: Check Python maintenance tools
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/*.py

      - name: Validate JSON and local asset links
        run: python tools/validate_static.py

      - name: Guard against legacy runtime layers
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'local-audio.js' index.html
          ! grep -q 'local-audio.css' index.html
          ! grep -q 'data:image/' index.html
