name: Polish LyricTube v0.12 startup

on:
  push:
    paths:
      - '.polish-v012'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python tools/polish_v012.py
      - run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)
          for file in tests/*.test.js; do [ -e "$file" ] || continue; node "$file"; done
          python tools/validate_static.py
      - run: rm -f .polish-v012 tools/polish_v012.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: finalize local media startup reliability"
          git push
