name: Temporary Account Registration Patch

on:
  push:
    branches:
      - feat/self-service-account-registration

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[registration-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/self-service-account-registration
          fetch-depth: 0
      - name: Apply exact patch
        run: python3 tools/temp_patch_account_registration.py
      - name: Validate patched JavaScript
        run: node --check site-shell.js
      - name: Validate diff
        run: git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-shell.js index.html version.js
          if git diff --cached --quiet; then
            echo "No patch changes"
            exit 0
          fi
          git commit -m "feat: add self-service account registration [registration-patch]"
          git push origin HEAD:feat/self-service-account-registration
