name: Restore LyricTube brand presentation

on:
  push:
    paths:
      - '.restore-brand-version'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore original icon and VReview-style version UI
        run: python tools/restore_brand_version.py

      - name: Validate runtime files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('.').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          html = Path('index.html').read_text(encoding='utf-8')
          assert 'assets/lyrictube-icon.webp' in html
          assert 'assets/lyrictube-icon.svg' not in html
          assert 'MY MUSIC · <span data-app-version>v0.10.2</span>' in html
          assert '<span class="version-badge">' not in html
          assert Path('assets/lyrictube-icon.webp').exists()
          PY

      - name: Remove one-shot maintenance files
        shell: bash
        run: |
          rm -f .restore-brand-version
          rm -f tools/restore_brand_version.py
          rm -f .github/workflows/restore-brand-version.yml

      - name: Commit restoration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore original icon and VReview-style version display"
          git push
