name: Apply playback diagnostics cleanup

on:
  push:
    branches:
      - chore/remove-playback-diagnostics
    paths:
      - tools/remove_playback_diagnostics.py
      - .github/workflows/apply-remove-playback-diagnostics.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/remove-playback-diagnostics
      - name: Apply cleanup
        run: python tools/remove_playback_diagnostics.py
      - name: Validate
        run: |
          node --check a1-ui-guards.js
          node tests/a1-requirements.test.js
          node tests/runtime-guards.test.js
          python tools/validate_static.py
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset tools/remove_playback_diagnostics.py .github/workflows/apply-remove-playback-diagnostics.yml
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "chore: remove playback diagnostics UI"
          git push origin HEAD:chore/remove-playback-diagnostics
