name: Apply tag sidebar toggle fix

on:
  push:
    branches:
      - fix/tag-sidebar-toggle
    paths:
      - tools/apply_tag_sidebar_toggle.py
      - .github/workflows/apply-tag-sidebar-toggle.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tag-sidebar-toggle
      - name: Apply fix
        run: python tools/apply_tag_sidebar_toggle.py
      - name: Validate focused change
        run: |
          node --check tags.js
          node tests/song-form-tags.test.js
          python tools/validate_static.py
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tags.js tests/song-form-tags.test.js REQUIREMENTS.md version.js data/defaults.json index.html README.md docs/CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "fix: toggle active sidebar tag filter"
          git push origin HEAD:fix/tag-sidebar-toggle
