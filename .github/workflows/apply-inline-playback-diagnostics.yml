name: Apply inline playback diagnostics

on:
  push:
    branches:
      - diag/inline-youtube-events
    paths:
      - tools/apply_inline_playback_diagnostics.py
      - .github/workflows/apply-inline-playback-diagnostics.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/inline-youtube-events
      - name: Apply diagnostic patch
        run: python tools/apply_inline_playback_diagnostics.py
      - name: Validate
        run: |
          node --check app.js
          node --check a1-ui-guards.js
          node tests/a1-requirements.test.js
          python tools/validate_static.py
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js a1-ui-guards.js version.js index.html README.md data/defaults.json playback-diagnostics.html
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "feat: add inline YouTube playback diagnostics"
          git push origin HEAD:diag/inline-youtube-events
