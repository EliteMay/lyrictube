name: Apply Fair Shuffle Patch

on:
  push:
    branches:
      - fix/fair-shuffle-visual-baseline
    paths:
      - .github/workflows/apply-fair-shuffle.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact patch
        run: python tools/apply_fair_shuffle_patch.py

      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check site-shell.js
          node --check core/fair-shuffle.js

      - name: Regression tests
        run: |
          for test in tests/*.test.js; do
            echo "==> $test"
            node "$test"
          done

      - name: Static validation
        run: python tools/validate_static.py

      - name: Diff check
        run: git diff --check

      - name: Commit validated runtime patch
        run: |
          if git diff --quiet -- app.js site-shell.js; then
            echo "No runtime patch needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js site-shell.js
          git commit -m "fix: make shuffle favor unheard tracks"
          git push
