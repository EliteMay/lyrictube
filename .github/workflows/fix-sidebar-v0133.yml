name: Fix LyricTube sidebar v0.13.3

on:
  push:
    paths:
      - '.github/workflows/fix-sidebar-v0133.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply guide-aligned sidebar fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          VERSION = 'v0.13.3'
          BUILD = '20260830-8'

          # --- index.html: brand header + one scroll region + persistent tools ---
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          if 'class="sidebar-scroll"' not in text:
              start = '      </div>\n\n      <label class="search-box">'
              if start not in text:
                  raise SystemExit('sidebar scroll start marker not found')
              text = text.replace(
                  start,
                  '      </div>\n\n      <div class="sidebar-scroll" aria-label="ライブラリと分類">\n        <label class="search-box">',
                  1,
              )
              end = '      <div id="songList" class="song-list"></div>\n\n      <div class="sidebar-tools">'
              if end not in text:
                  raise SystemExit('sidebar scroll end marker not found')
              text = text.replace(
                  end,
                  '      <div id="songList" class="song-list"></div>\n      </div>\n\n      <div class="sidebar-tools">',
                  1,
              )
          text = text.replace('>v0.13.2</span></p>', f'>{VERSION}</span></p>', 1)
          text = text.replace('<span id="settingsAppVersion">v0.11.0</span>', f'<span id="settingsAppVersion">{VERSION}</span>')
          text = text.replace('20260830-7', BUILD)
          p.write_text(text, encoding='utf-8')

          # --- styles.css: use one independent sidebar scroll region ---
          p = Path('styles.css')
          text = p.read_text(encoding='utf-8')
          old_sidebar = '.sidebar{height:100vh;position:sticky;top:0;border-right:1px solid var(--border);background:#0d0f13;padding:22px 16px 16px;display:flex;flex-direction:column;min-width:0}'
          new_sidebar = '.sidebar{height:100vh;position:sticky;top:0;border-right:1px solid var(--border);background:#0d0f13;padding:22px 16px 16px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-width:0;min-height:0;overflow:hidden}.sidebar-scroll{min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable;padding-right:3px}.sidebar-scroll .song-list{overflow:visible;flex:none;padding-right:0}.sidebar-scroll .playlist-nav,.sidebar-scroll .tag-sidebar-nav{max-height:none;overflow:visible}'
          if old_sidebar not in text and new_sidebar not in text:
              raise SystemExit('base sidebar rule not found')
          text = text.replace(old_sidebar, new_sidebar, 1)

          old_tools = '.sidebar-tools{display:grid;grid-template-columns:minmax(0,1fr) 38px minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:10px}'
          new_tools = '.sidebar-tools{display:grid;grid-template-columns:minmax(0,1fr) 38px minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);min-width:0;position:relative;z-index:2}.sidebar-tools .ghost-btn,.sidebar-tools .file-label{min-width:0;padding-left:7px;padding-right:7px;white-space:nowrap}'
          if old_tools not in text and new_tools not in text:
              raise SystemExit('sidebar tools rule not found')
          text = text.replace(old_tools, new_tools, 1)

          text = text.replace('.playlist-head{color:var(--muted);font-size:12px;padding:8px 4px}', '.playlist-head{color:var(--text);font-size:12px;font-weight:700;padding:8px 4px}', 1)
          text = text.replace('.library-head{color:var(--muted);font-size:12px;padding:13px 4px 8px', '.library-head{color:var(--text);font-size:12px;font-weight:700;padding:13px 4px 8px', 1)
          p.write_text(text, encoding='utf-8')

          # --- mobile.css: keep the sidebar shell clipped, but scroll only its middle row ---
          p = Path('mobile.css')
          text = p.read_text(encoding='utf-8')
          text = text.replace('/* ==========================================================\n   v31: mobile layout + simple access gate\n   ========================================================== */', '/* ==========================================================\n   Mobile layout + access gate\n   ========================================================== */', 1)
          text = text.replace('.song-list{max-height:none!important;min-height:100px!important}', '.song-list{max-height:none!important;min-height:0!important}', 1)
          marker = '  .sidebar-tools{grid-template-columns:minmax(0,1fr) 38px minmax(0,1fr) minmax(0,1fr)!important}\n  .sidebar-tools .ghost-btn,.sidebar-tools .file-label{min-height:40px}\n}'
          replacement = '  .sidebar-scroll{min-height:0!important;overflow-y:auto!important;overscroll-behavior:contain}\n  .sidebar-tools{grid-template-columns:minmax(0,1fr) 38px minmax(0,1fr) minmax(0,1fr)!important;margin-top:8px!important;padding-top:8px!important}\n  .sidebar-tools .ghost-btn,.sidebar-tools .file-label{min-height:40px}\n}'
          if marker not in text and replacement not in text:
              raise SystemExit('mobile sidebar tools marker not found')
          text = text.replace(marker, replacement, 1)
          compact = '''\n@media(max-width:900px) and (max-height:640px){\n  .sidebar{padding-top:10px!important;padding-bottom:10px!important}\n  .brand-subtitle{display:none!important}\n  .sidebar-scroll .search-box{margin-top:10px}\n  .sidebar-scroll .view-nav{margin:8px 0}\n  .sidebar-scroll .view-btn{padding-top:7px;padding-bottom:7px}\n  .sidebar-scroll .tag-sidebar-head{margin-top:10px}\n  .sidebar-tools{margin-top:6px!important;padding-top:6px!important}\n}\n'''
          if '@media(max-width:900px) and (max-height:640px)' not in text:
              text += compact
          p.write_text(text, encoding='utf-8')

          # --- tags.css: remove stale version label and improve sidebar section contrast ---
          p = Path('tags.css')
          text = p.read_text(encoding='utf-8')
          text = text.replace('/* LyricTube v35 - user tags */', '/* LyricTube user tags */', 1)
          text = text.replace('color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.08em}', 'color:var(--text);font-size:10px;font-weight:800;letter-spacing:.08em}', 1)
          p.write_text(text, encoding='utf-8')

          # --- runtime fallbacks stay aligned with version.js ---
          runtime_files = [
              'app.js','site-shell.js','profile-data.js','cloud-sync.js','lyrics-providers.js',
              'local-media.js','tags.js','library-schema.js','sync-interpolation.js',
              'core/app-utils.js','core/runtime-hooks.js','core/player-controller.js'
          ]
          for name in runtime_files:
              path = Path(name)
              if not path.exists():
                  continue
              value = path.read_text(encoding='utf-8')
              value = value.replace('v0.13.2', VERSION).replace('20260830-7', BUILD)
              path.write_text(value, encoding='utf-8')

          # --- version SSOT / defaults ---
          p = Path('version.js')
          text = p.read_text(encoding='utf-8').replace('version: "v0.13.2"', f'version: "{VERSION}"').replace('build: "20260830-7"', f'build: "{BUILD}"')
          p.write_text(text, encoding='utf-8')

          p = Path('data/defaults.json')
          text = p.read_text(encoding='utf-8').replace('"appVersion": "v0.13.2"', f'"appVersion": "{VERSION}"').replace('"buildRevision": "20260830-7"', f'"buildRevision": "{BUILD}"')
          p.write_text(text, encoding='utf-8')

          # --- Regression guard: this bug must not return ---
          test = Path('tests/sidebar-layout.test.js')
          test.write_text(r'''const fs=require("fs");
const assert=require("assert");
const index=fs.readFileSync("index.html","utf8");
const styles=fs.readFileSync("styles.css","utf8");
const mobile=fs.readFileSync("mobile.css","utf8");

assert(index.includes('class="sidebar-scroll"'),"sidebar needs a dedicated scroll region");
assert(/class="sidebar-scroll"[\s\S]*id="songList"[\s\S]*<\/div>[\s\S]*class="sidebar-tools"/.test(index),"sidebar tools must be outside the scroll region");
assert(styles.includes('grid-template-rows:auto minmax(0,1fr) auto'),"sidebar must reserve rows for header, scroll area and tools");
assert(styles.includes('.sidebar-scroll{min-height:0;overflow-y:auto'),"sidebar middle area must be independently scrollable");
assert(!mobile.includes('min-height:100px!important'),"mobile song list must not force tools off-screen");
assert(mobile.includes('@media(max-width:900px) and (max-height:640px)'),"low-height viewport guard is required");
console.log("sidebar layout regression guards passed");
''', encoding='utf-8')

          # --- Documentation ---
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace('**Current version: v0.13.2**', f'**Current version: {VERSION}**', 1)
          text = text.replace('**Build: 20260830-7**', f'**Build: {BUILD}**', 1)
          text = text.replace('- 表示: `v0.13.2`', f'- 表示: `{VERSION}`', 1)
          text = text.replace('- Build: `20260830-7`', f'- Build: `{BUILD}`', 1)
          text = text.replace('- `tests/*.test.js` の同期補間ロジックテスト', '- `tests/*.test.js` のPureロジック / Runtime / Sidebar回帰テスト', 1)
          note = '''\n## v0.13.3 Sidebar安定化\n\n- Sidebarを「ブランド / 中央スクロール / 操作ツール」の3領域に整理。\n- タグ・プレイリスト・曲一覧は中央領域だけをスクロールし、`設定 / ? / 書き出し / 読み込み` は常に表示領域へ残す。\n- 低い縦解像度・モバイル・表示倍率が高い状態で主要操作が押し出されにくい構造へ変更。\n- Sidebarの見出しコントラストを改善。\n- 保存形式 `lyrictube.library.v3` / Schema 4への変更はありません。\n'''
          anchor = '\n## v0.12.0 安定性修正\n'
          if '## v0.13.3 Sidebar安定化' not in text:
              text = text.replace(anchor, note + anchor, 1)
          p.write_text(text, encoding='utf-8')

          report = '''## v0.13.3 Sidebar安定化（2026-08-30）\n\n- `web-project-guide` の既存サイト修正ルート、F-006 / F-012、UI / UX / Quality Checklistを基準に修正。\n- Sidebarを3行Gridへ変更し、ブランド・中央スクロール領域・下部操作を分離。\n- タグ / プレイリスト / 曲一覧を単一の中央スクロール領域へまとめ、下部の `設定 / ? / 書き出し / 読み込み` が画面外へ押し出される問題を修正。\n- 低い縦解像度向けに余白を圧縮し、ブランド補足文を非表示にする高さBreakpointを追加。\n- Sidebarセクション見出しのコントラストを改善。\n- `tests/sidebar-layout.test.js` を追加し、スクロール領域・ツール位置・低高さ対策を回帰Guard化。\n- 保存形式 `lyrictube.library.v3` / Schema 4は変更なし。\n- Static Validation対象。実ブラウザでの低い縦解像度 / 125〜150% Zoom表示はユーザー確認が必要。\n\n'''
          p = Path('作業報告書.md')
          text = p.read_text(encoding='utf-8')
          if not text.startswith('## v0.13.3 Sidebar安定化'):
              p.write_text(report + text, encoding='utf-8')

          p = Path('docs/CHANGELOG.md')
          text = p.read_text(encoding='utf-8')
          changelog = '''## v0.13.3 Sidebar安定化（2026-08-30）\n\n- Sidebarをブランド / 独立Scroll / 操作ツールの3領域へ整理。\n- 低い画面やモバイルで設定・ヘルプ・書き出し・読み込みが消える問題を修正。\n- タグ / プレイリスト / 曲一覧のNested Scrollを減らし、中央領域へ集約。\n- Sidebar見出しの視認性を改善。\n- Sidebar LayoutのRegression Guardを追加。\n- 保存Schema変更なし。\n\n'''
          if not text.startswith('## v0.13.3 Sidebar安定化'):
              p.write_text(changelog + text, encoding='utf-8')
          PY

      - name: Validate changed files
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check site-shell.js
          node --check tags.js
          node tests/sidebar-layout.test.js
          for file in tests/*.test.js; do node "$file"; done
          python tools/validate_static.py
          python -m json.tool data/defaults.json >/dev/null

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html styles.css mobile.css tags.css version.js data/defaults.json app.js site-shell.js profile-data.js cloud-sync.js lyrics-providers.js local-media.js tags.js library-schema.js sync-interpolation.js core README.md 作業報告書.md docs/CHANGELOG.md tests/sidebar-layout.test.js
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix: keep sidebar controls visible'
          git push origin HEAD:main
